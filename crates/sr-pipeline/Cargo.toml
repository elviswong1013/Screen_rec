[package]
name = "sr-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Screen_rec 管线（sidecar 管理/命名/分段/收尾；M3：单路视频 route）"

[dependencies]
# 运行时工具解析（M11-C P1-5：ffmpeg/ffprobe 安装后路径；env/resource/exe/dev 回退）。
sr-core = { path = "../sr-core" }

# 视频捕获面（帧槽/画布 NV12/管道写）。
sr-capture = { path = "../sr-capture" }

# 音频隔离面（REQ-14/17：App 身份校验、进程环回流式采集）。
sr-audio = { path = "../sr-audio" }

# 本地时区偏移（REQ-24 命名时间戳）+ 窗口标题（Window 目标名，REQ-24 sanitize 来源）
# + sidecar Job 对象绑定（D8/REQ-22：主进程消失 → sidecar 连带终止）+ QPC 时基
# （SessionManifest.start_qpc，REQ-25/§3.4）。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Performance",
    "Win32_System_SystemServices",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }
